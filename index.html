<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script type="module">
import { HandLandmarker, FilesetResolver } from "/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs";
const fileset = await FilesetResolver.forVisionTasks("/node_modules/@mediapipe/tasks-vision/wasm");
const landmarker = await HandLandmarker.createFromOptions(fileset, {
  baseOptions: { modelAssetPath: "/models/hand_landmarker.task", delegate: "GPU" },
  numHands: 2,
  runningMode: "IMAGE",
  minHandDetectionConfidence: 0.3
});
window.__landmarker = landmarker;
window.__ready = true;
window.__detect = (b64) => {
  const img = new Image();
  img.src = "data:image/jpeg;base64," + b64;
  return new Promise((res, rej) => {
    img.onerror = rej;
    img.onload = () => {
      const W = Math.min(img.naturalWidth, 640);
      const H = Math.min(img.naturalHeight, 640);
      const ratio = Math.min(W / img.naturalWidth, H / img.naturalHeight, 1);
      const w = Math.round(img.naturalWidth * ratio);
      const h = Math.round(img.naturalHeight * ratio);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const imageData = ctx.getImageData(0, 0, w, h);
      const result = window.__landmarker.detectForImage(imageData, Date.now());
      const hands = (result.landmarks || []).map((lm, i) => ({
        handedness: result.handednesses?.[i]?.[0]?.categoryName || "Unknown",
        n: lm.length,
        first: lm[0]
      }));
      res({ w, h, hands, count: hands.length });
    };
  });
};
</script>
</body></html>
